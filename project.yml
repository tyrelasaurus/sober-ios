name: Sober
options:
  bundleIdPrefix: com.tyrelshaw
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Sober:
    type: application
    platform: iOS
    sources:
      - path: Sober
    resources:
      - path: Sober/Resources
    info:
      path: Sober/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: Sober
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrelshaw.sober.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES

  SoberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SoberTests
    dependencies:
      - target: Sober
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tyrelshaw.sober.ios.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sober:
    build:
      targets:
        Sober: all
        SoberTests: [test]
    test:
      targets:
        - SoberTests
    run:
      config: Debug
